name: Build Beryllium Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev zip unzip git clang llvm lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Get Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out beryllium_defconfig
          
          echo "CONFIG_CFG80211=y" >> out/.config
          echo "CONFIG_MAC80211=y" >> out/.config
          echo "CONFIG_ATH_CARDS=y" >> out/.config
          echo "CONFIG_ATH9K_HTC=y" >> out/.config
          
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/' out/.config
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' out/.config
          
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' out/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config

          sed -i 's/CONFIG_SHADOW_CALL_STACK=y/# CONFIG_SHADOW_CALL_STACK is not set/' out/.config

          # Disable the conflicting crc32-arm64 object from crypto Makefile
          sed -i '/crc32-arm64/d' arch/arm64/crypto/Makefile

          make O=out olddefconfig
          make -j$(nproc --all) O=out LLVM=1 LLVM_IAS=1 KBUILD_CFLAGS="-w"

      - name: Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || cp out/arch/arm64/boot/Image.gz AnyKernel/
          cd AnyKernel
          zip -r9 ../AnyKernel3-beryllium.zip *
