name: Build Beryllium Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libglib2.0-dev libpixman-1-dev zip unzip git clang llvm lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out beryllium_defconfig
          
          echo "CONFIG_CFG80211=y" >> out/.config
          echo "CONFIG_MAC80211=y" >> out/.config
          echo "CONFIG_ATH_CARDS=y" >> out/.config
          echo "CONFIG_ATH9K_HTC=y" >> out/.config
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> out/.config
          
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/' out/.config
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' out/.config
          
          make -j$(nproc --all) O=out

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || cp out/arch/arm64/boot/Image.gz AnyKernel/ || cp out/arch/arm64/boot/Image AnyKernel/
          cd AnyKernel
          zip -r9 ../AnyKernel3-beryllium-ath9k.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-beryllium-ath9k
          path: AnyKernel3-beryllium-ath9k.zip
